spring.application.name=jogos
server.port=8080
# Banco H2 em arquivo (troque por PostgreSQL/MySQL depois, se quiser)
spring.datasource.url=jdbc:h2:file:./data/escola;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Não expor detalhes de erro ao aluno (critério 4)
server.error.include-message=never
server.error.include-stacktrace=never
